inputs:
  selection:
    scan_interval_ms: 100
    promote_stable_ms: 500
sources:
  crsf:
    type: crsf
    device: /dev/ttyCRSF
    baud_rate: 921600
    priority: 100
    ready_timeout_ms: 1000
    loss_timeout_ms: 300
    cooldown_ms: 1000
    signals:
      crsf.left_y:
        from: crsf.xbox.right_y
      crsf.left_x:
        from: crsf.xbox.left_x
      crsf.yaw:
        from: crsf.xbox.hat_x
      crsf.trigger_left:
        from: crsf.xbox.trigger_left
      crsf.trigger_right:
        from: crsf.xbox.trigger_right
      crsf.a:
        from: crsf.xbox.button.a
      crsf.b:
        from: crsf.xbox.button.b
      crsf.x:
        from: crsf.xbox.button.x
      crsf.y:
        from: crsf.xbox.button.y
      crsf.lb:
        from: crsf.xbox.button.lb
      crsf.rb:
        from: crsf.xbox.button.rb
      crsf.back:
        from: crsf.xbox.button.back
      crsf.start:
        from: crsf.xbox.button.start
  gamepad:
    type: joystick
    device: /dev/input/jsBattleDragon
    priority: 50
    ready_timeout_ms: 1000
    loss_timeout_ms: 300
    cooldown_ms: 1000
    signals:
      gamepad.left_y:
        from: js.axis.3
      gamepad.left_x:
        from: js.axis.0
      gamepad.yaw:
        from: js.axis.6
      gamepad.trigger_left:
        from: js.axis.5
      gamepad.trigger_right:
        from: js.axis.4
      gamepad.stop:
        from: js.button.11
      gamepad.start:
        from: js.button.14
      gamepad.lb:
        from: js.button.6
      gamepad.rb:
        from: js.button.7
      gamepad.a:
        from: js.button.0
      gamepad.b:
        from: js.button.1
      gamepad.x:
        from: js.button.3
      gamepad.y:
        from: js.button.4
curves:
  stick:
    type: expo
    deadzone: 0.03
    expo: 0.0
    limit:
    - -1.0
    - 1.0
    calibration:
      input:
      - -1.0
      - 0.0
      - 1.0
      output:
      - -1.0
      - 0.0
      - 1.0
controls:
  move.vx:
    type: analog
    mix: max_abs
    inputs:
    - source: gamepad.left_y
      direction: -1
      curve: stick
    - source: crsf.left_y
      direction: -1
      curve: stick
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.03
  move.vy:
    type: analog
    mix: max_abs
    inputs:
    - source: gamepad.left_x
      direction: -1
      curve: stick
    - source: crsf.left_x
      direction: -1
      curve: stick
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.03
  move.yaw:
    type: analog
    mix: max_abs
    inputs:
    - source: gamepad.yaw
      direction: -1
      curve: stick
    - source: crsf.yaw
      direction: -1
      curve: stick
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.05
  gamepad.stop_event:
    type: bool
    inputs:
    - source: gamepad.stop
  gamepad.start_event:
    type: bool
    inputs:
    - source: gamepad.start
  gamepad.lb_event:
    type: bool
    inputs:
    - source: gamepad.lb
  gamepad.rb_event:
    type: bool
    inputs:
    - source: gamepad.rb
  gamepad.a_event:
    type: bool
    inputs:
    - source: gamepad.a
  gamepad.b_event:
    type: bool
    inputs:
    - source: gamepad.b
  gamepad.x_event:
    type: bool
    inputs:
    - source: gamepad.x
  gamepad.y_event:
    type: bool
    inputs:
    - source: gamepad.y
  crsf.stop_event:
    type: bool
    inputs:
    - source: crsf.back
  crsf.start_event:
    type: bool
    inputs:
    - source: crsf.start
  crsf.lb_event:
    type: bool
    inputs:
    - source: crsf.lb
  crsf.rb_event:
    type: bool
    inputs:
    - source: crsf.rb
  crsf.a_event:
    type: bool
    inputs:
    - source: crsf.a
  crsf.b_event:
    type: bool
    inputs:
    - source: crsf.b
  crsf.x_event:
    type: bool
    inputs:
    - source: crsf.x
  crsf.y_event:
    type: bool
    inputs:
    - source: crsf.y
  system.stop_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.stop_event
        - crsf.stop_event
      value: true
  system.start_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.start_event
        - crsf.start_event
      value: true
  shoulder.left_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.lb_event
        - crsf.lb_event
      value: true
  shoulder.right_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.rb_event
        - crsf.rb_event
      value: true
  button.a_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.a_event
        - crsf.a_event
      value: true
  button.b_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.b_event
        - crsf.b_event
      value: true
  button.x_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.x_event
        - crsf.x_event
      value: true
  button.y_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.y_event
        - crsf.y_event
      value: true
  gamepad.trigger.left_event:
    type: bool
    threshold: 0.85
    hysteresis: 0.05
    inputs:
    - source: gamepad.trigger_left
  gamepad.trigger.right_event:
    type: bool
    threshold: 0.85
    hysteresis: 0.05
    inputs:
    - source: gamepad.trigger_right
  crsf.trigger.left_event:
    type: bool
    threshold: 0.85
    hysteresis: 0.05
    inputs:
    - source: crsf.trigger_left
  crsf.trigger.right_event:
    type: bool
    threshold: 0.85
    hysteresis: 0.05
    inputs:
    - source: crsf.trigger_right
  trigger.left_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.trigger.left_event
        - crsf.trigger.left_event
      value: true
  trigger.right_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.trigger.right_event
        - crsf.trigger.right_event
      value: true
outputs:
  conflict_policy: first_wins
  publish_on_change: true
  analog:
    vx: move.vx
    vy: move.vy
    yaw:
      controls:
      - move.yaw
      mix: max_abs
  edge:
  - output: system.stop
    when:
    - system.stop_event
  - output: system.start
    when:
    - system.start_event
  level:
  # RT+X releases all joints, including the head and arms.
  - output: btn_2=1
    when:
    - trigger.right_event
    - button.x_event
    - released: shoulder.left_event
    - released: shoulder.right_event
    - released: trigger.left_event
    - released: button.a_event
    - released: button.b_event
    - released: button.y_event
  # LB+B selects the ELF4 AMP policy.onnx.
  - output: btn_10=40
    when:
    - shoulder.left_event
    - button.b_event
    - released: shoulder.right_event
    - released: trigger.left_event
    - released: trigger.right_event
    - released: button.a_event
    - released: button.x_event
    - released: button.y_event
  # RB+Y holds every controlled joint at zero position with PD.
  - output: btn_4=1
    when:
    - shoulder.right_event
    - button.y_event
    - released: shoulder.left_event
    - released: trigger.left_event
    - released: trigger.right_event
    - released: button.a_event
    - released: button.b_event
    - released: button.x_event
  # RB+A selects the ELF4 DWAQ policy.
  - output: btn_10=41
    when:
    - shoulder.right_event
    - button.a_event
    - released: shoulder.left_event
    - released: trigger.left_event
    - released: trigger.right_event
    - released: button.b_event
    - released: button.x_event
    - released: button.y_event
  - output: btn_3=1
    when:
    - shoulder.right_event
    - button.b_event
    - released: shoulder.left_event
    - released: trigger.left_event
    - released: trigger.right_event
    - released: button.a_event
    - released: button.x_event
    - released: button.y_event
  - output: btn_1=1
    when:
    - shoulder.right_event
    - button.x_event
    - released: shoulder.left_event
    - released: trigger.left_event
    - released: trigger.right_event
    - released: button.a_event
    - released: button.b_event
    - released: button.y_event
system:
  start:
  - mkdir -p /var/log/bxi_log
  - ros2 launch bxi_example_py_elf3 example_demo_hw.launch.py > /var/log/bxi_log/$(date
    +%Y-%m-%d_%H-%M-%S)_elf.log 2>&1 &
  - ros2 launch bxi_example_bms bms.launch.py > /var/log/bxi_log/bms_$(date +%Y-%m-%d_%H-%M-%S)_bms.log
    2>&1 &
  stop:
  - pkill -SIGINT -f '[r]os2 launch bxi_example_py_elf3 example_demo_hw[.]launch[.]py'
    || true
  - sleep 2
  - pkill -SIGINT -f '[/]hardware_elf3/hardware_elf3|[/]hardware_kaixuan_arms/dual_kaixuan_arms|[/]bxi_imu/imu_node|[/]com[.]xmz[.]walk/feedback[.]py|[/]bxi_example_py_elf3/bxi_example_py_elf3_demo'
    || true
  - pkill -SIGINT -f '[r]os2 launch bxi_example_bms bms\.launch\.py|[/]bxi_bms|[/]bxi_example_bms'
    || true
  - pkill -SIGKILL -f '[r]os2 launch bxi_example_bms bms\.launch\.py|[/]bxi_bms|[/]bxi_example_bms'
    || true
system_mutexes:
  robot_process:
    acquire: start
    release: stop
system_reset_motion_after:
- start
- stop
