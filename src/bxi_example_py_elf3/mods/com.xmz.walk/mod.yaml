schema: 1
id: com.xmz.walk
name: ELF4 XMZ 行走
version: 1.0.0
api: '>=4,<5'
enable: true
entrypoint: plugin:create_mod
visibility: public
requires:
- id: com.bxi.basic_actions
  version: '>=1,<2'
conflicts: []
python_exports: []
runtime_requirements:
  python:
  - import: numpy
  - import: onnxruntime
  ros: []
  system: []
events:
  walk:
    slot: btn_1
    value: 1
speed_profiles:
  walk:
    vx_scale: 1.0
    vx_min: -0.5
    vx_max: 1.0
    vy_scale: 0.5
    vy_min: -0.5
    vy_max: 0.5
    yaw_scale: 1.57
    yaw_min: -1.57
    yaw_max: 1.57
states:
  walk:
    inference_hz: 50
    speed_profile: walk
    manifest:
      label: xmz 行走
      priority: 1000
      group: Base
      icon: directions_walk
routes:
- from: com.bxi.basic_actions/pd_brake
  event: walk
  to: walk
  transition: first_frame_switch
- from: walk
  event: com.bxi.basic_actions/pd_brake
  to: com.bxi.basic_actions/pd_brake
  transition: first_frame_switch
- from: walk
  event: com.bxi.basic_actions/zero_torque
  to: com.bxi.basic_actions/zero_torque
  transition: instant
- from: walk
  event: com.bxi.basic_actions/initial_pos
  to: com.bxi.basic_actions/initial_pos
  transition: first_frame_switch
