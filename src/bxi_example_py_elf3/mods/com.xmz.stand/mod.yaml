schema: 1
id: com.xmz.stand
name: ELF4 XMZ 站立轮播
version: 1.6.0
api: '>=4,<5'
enable: true
entrypoint: plugin:create_mod
visibility: public
requires:
  - id: com.bxi.basic_actions
    version: '>=1,<2'
conflicts: []
python_exports: []
runtime_requirements:
  python:
    - import: numpy
    - import: onnxruntime
  ros: []
  system: []

events:
  stand:
    slot: btn_5
    value: 1

states:
  stand:
    inference_hz: 50
    params:
      play_arm_motion: true
      arm_clip: cycle
      arm_speed: 0.5
    manifest:
      label: XMZ 站立轮播
      priority: 995
      group: Base
      icon: accessibility_new
      confirm: true
      confirm_message: 进入后将自动轮流挥手、播放一段训练动作并鼓掌，请确认双臂周围有足够空间。

transition_profiles:
  posture_blend:
    type: running_blend
    duration: 0.6
    curve: smoothstep
    sample_from: false
    sample_to: false

routes:
  - from: com.bxi.basic_actions/pd_brake
    event: stand
    to: stand
    transition: posture_blend
  - from: stand
    event: com.bxi.basic_actions/zero_torque
    to: com.bxi.basic_actions/zero_torque
    transition: instant
  - from: stand
    event: com.bxi.basic_actions/pd_brake
    to: com.bxi.basic_actions/pd_brake
    transition: posture_blend
  - from: stand
    event: com.bxi.basic_actions/initial_pos
    to: com.bxi.basic_actions/initial_pos
    transition: posture_blend
