schema: 1
id: com.bxi.elf4
name: ELF4 AMP / DWAQ
version: 1.3.1
api: ">=4,<5"
enable: true
entrypoint: plugin:create_mod
visibility: public
requires:
  - id: com.bxi.basic_actions
    version: ">=1,<2"
  - id: com.xmz.walk
    version: ">=1,<2"
conflicts: []
python_exports: []
runtime_requirements:
  python:
    - import: numpy
    - import: onnxruntime
  ros: []
  system: []

events:
  activate:
    slot: btn_10
    # ARM-08: LB+B, with RB/LT/RT and other face buttons released.
    value: 40
  activate_dwaq:
    slot: btn_10
    # ARM-08: RB+A, with LB/LT/RT and other face buttons released.
    value: 41

speed_profiles:
  elf4:
    vx_scale: 1.0
    vx_min: -0.6
    vx_max: 1.0
    vy_scale: 1.0
    vy_min: -0.5
    vy_max: 0.5
    yaw_scale: 1.0
    yaw_min: -1.57
    yaw_max: 1.57

states:
  elf4:
    manifest:
      label: ELF4 Repaired 49999
      priority: 936
      group: Advanced
      icon: directions_run
      confirm: true
      confirm_message: 请确保机器人处于吊装或保护架，并确认急停可用
    speed_profile: elf4
    inference_hz: 50.0
  elf4_dwaq_1500:
    manifest:
      label: ELF4 DWAQ 54000（腰腿）
      priority: 937
      group: Advanced
      icon: directions_run
      confirm: true
      confirm_message: 请确保机器人处于吊装或保护架，并确认急停可用
    speed_profile: elf4
    inference_hz: 50.0

routes:
  - from: com.bxi.basic_actions/zero_position
    event: activate
    to: elf4
    transition: soft_switch
  - from: com.xmz.walk/walk
    event: activate
    to: elf4
    transition: soft_switch
  - from: elf4
    event: com.xmz.walk/walk
    to: com.xmz.walk/walk
    transition: first_frame_switch
  - from: elf4
    event: com.bxi.basic_actions/zero_position
    to: com.bxi.basic_actions/zero_position
    transition: first_frame_switch
  - from: elf4_dwaq_1500
    event: com.bxi.basic_actions/zero_position
    to: com.bxi.basic_actions/zero_position
    transition: first_frame_switch
  - from: com.bxi.basic_actions/zero_position
    event: activate_dwaq
    to: elf4_dwaq_1500
    transition: soft_switch
  - from: com.bxi.basic_actions/pd_brake
    event: activate
    to: elf4
    transition: soft_switch
  - from: com.bxi.basic_actions/pd_brake
    event: activate_dwaq
    to: elf4_dwaq_1500
    transition: soft_switch
  - from: elf4
    event: activate_dwaq
    to: elf4_dwaq_1500
    transition: soft_switch
  - from: elf4_dwaq_1500
    event: activate
    to: elf4
    transition: soft_switch
  - from: elf4
    event: com.bxi.basic_actions/pd_brake
    to: com.bxi.basic_actions/pd_brake
    transition: first_frame_switch
  - from: elf4_dwaq_1500
    event: com.bxi.basic_actions/pd_brake
    to: com.bxi.basic_actions/pd_brake
    transition: first_frame_switch
  - from: com.xmz.walk/walk
    event: activate_dwaq
    to: elf4_dwaq_1500
    transition: soft_switch
  - from: elf4_dwaq_1500
    event: com.xmz.walk/walk
    to: com.xmz.walk/walk
    transition: first_frame_switch
