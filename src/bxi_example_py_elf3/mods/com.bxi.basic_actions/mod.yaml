schema: 1
id: com.bxi.basic_actions
name: 基础动作
version: 1.0.0
api: '>=4,<5'
enable: true
entrypoint: plugin:create_mod
visibility: public
requires: []
conflicts: []
python_exports: []
runtime_requirements:
  python: []
  ros:
  - package: rclpy
  - package: geometry_msgs
  system: []
events:
  pd_brake:
    slot: btn_3
    value: 1
  zero_position:
    slot: btn_4
    value: 1
states:
  zero_torque: {}
  zero_position:
    manifest:
      label: 零位
      priority: 979
      group: Base
      icon: accessibility_new
      confirm: true
      confirm_message: 机器人将通过PD保持所有受控关节在0rad，请确保机器人处于吊装或保护架
  pd_brake:
    manifest:
      label: 初始姿态
      priority: 980
      group: Base
      icon: settings_backup_restore
      confirm: true
      confirm_message: 机器人将进入初始姿态，所有电机进入PD制动模式，失去支撑能力，请确保机器人处于安全状态
routes:
- from: zero_torque
  event: zero_position
  to: zero_position
  transition: first_frame_switch
- from: pd_brake
  event: zero_position
  to: zero_position
  transition: first_frame_switch
- from: zero_position
  event: pd_brake
  to: pd_brake
  transition: first_frame_switch
- from: zero_torque
  event: pd_brake
  to: pd_brake
  transition: first_frame_switch
